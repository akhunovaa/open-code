<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="dialog">
    <style>
        #steeve-dialog {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 30; display: none;
            background: rgba(10,15,30,0.97); border: 1px solid rgba(245,181,59,0.5);
            border-radius: 12px; padding: 24px; max-width: 420px; width: 90%;
            text-align: center; pointer-events: auto;
            box-shadow: 0 8px 40px rgba(0,0,0,.6);
            opacity: 1; transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #steeve-dialog.fade-out { opacity: 0; transform: translate(-50%,-40%); pointer-events: none; }
        #steeve-dialog h2 { color: #f5b53b; font-size: 18px; margin-bottom: 12px; }
        #steeve-dialog p { color: #ccc; font-size: 15px; line-height: 1.6; margin-bottom: 16px; }
        #steeve-dialog .steeve-close {
            background: rgba(245,181,59,0.15); border: 1px solid rgba(245,181,59,0.6);
            color: #f5b53b; padding: 8px 24px; border-radius: 6px; cursor: pointer;
            font-size: 14px; pointer-events: auto; transition: all 0.15s;
        }
        #steeve-dialog .steeve-close:hover { background: rgba(245,181,59,0.35); color: #fff; }

        #steeve-dialog .steeve-price-btn {
            background: rgba(21,101,192,0.4); border: 1px solid rgba(91,155,245,0.6);
            color: #5b9bf5; padding: 8px 24px; border-radius: 6px; cursor: pointer;
            font-size: 14px; pointer-events: auto; transition: all 0.15s; width: 100%;
        }
        #steeve-dialog .steeve-price-btn:hover { background: rgba(21,101,192,0.7); color: #fff; }
        #steeve-dialog .steeve-price-btn:disabled { opacity: 0.6; cursor: wait; }
        #steeve-dialog .steeve-wallet-box {
            background: rgba(245,181,59,0.08); border: 1px solid rgba(245,181,59,0.3);
            border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: left;
        }
        #steeve-dialog .steeve-wallet-box .label { color: #f5b53b; font-size: 13px; margin-bottom: 6px; }
        #steeve-dialog .steeve-wallet-box .mono {
            color: #8ef; font-size: 13px; word-break: break-all;
            position: relative;
        }
        #steeve-dialog .steeve-wallet-box .mono .addr-link {
            cursor: pointer; transition: color 0.15s; color: #8ef;
        }
        #steeve-dialog .steeve-wallet-box .mono .addr-link:hover { color: #cde; text-decoration: underline; }
        #steeve-dialog .steeve-wallet-box .mono .copy-hint {
            display: inline-block; margin-left: 6px; font-size: 11px; color: #f5b53b; opacity: 0;
            transition: opacity 0.2s;
        }
        #steeve-dialog .steeve-wallet-box .mono .copy-hint.show { opacity: 1; }
        #steeve-dialog .steeve-wallet-box .dim { color: #aaa; font-size: 12px; word-break: break-all; }

        #steeve-info-dialog {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 40; display: none;
            background: rgba(10,15,30,0.97); border: 1px solid rgba(245,181,59,0.5);
            border-radius: 12px; padding: 24px; max-width: 460px; width: 90%;
            text-align: center; pointer-events: auto;
            box-shadow: 0 8px 40px rgba(0,0,0,.6);
            opacity: 1; transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #steeve-info-dialog.fade-out { opacity: 0; transform: translate(-50%,-40%); pointer-events: none; }
        #steeve-info-dialog h2 { color: #f5b53b; font-size: 18px; margin-bottom: 12px; }
        #steeve-info-dialog .steeve-info-content {
            color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 16px;
            text-align: left; max-height: 280px; overflow-y: auto;
        }
        #steeve-info-dialog .steeve-info-dialog-x {
            position: absolute; top: 10px; right: 14px;
            background: none; border: none; color: #5b9bf5; font-size: 22px;
            line-height: 1; cursor: pointer; pointer-events: auto;
            padding: 4px 8px; border-radius: 6px; transition: all 0.15s;
        }
        #steeve-info-dialog .steeve-info-dialog-x:hover { color: #fff; background: rgba(21,101,192,0.7); }
        #steeve-info-dialog .steeve-close {
            background: rgba(21,101,192,0.5); border: 1px solid rgba(91,155,245,0.6);
            color: #5b9bf5; padding: 8px 24px; border-radius: 6px; cursor: pointer;
            font-size: 14px; pointer-events: auto; transition: all 0.15s;
        }
        #steeve-info-dialog .steeve-close:hover { background: rgba(21,101,192,0.8); color: #fff; }

        #steeve-dialog .btc-price-box {
            background: rgba(245,181,59,0.08); border: 1px solid rgba(245,181,59,0.3);
            border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: left;
        }
        #steeve-dialog .btc-price-box .label { color: #f5b53b; font-size: 13px; margin-bottom: 6px; }
        #steeve-dialog .btc-price-box .price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        #steeve-dialog .btc-price-box .price-val { color: #8ef; font-size: 14px; word-break: break-all; flex: 1; }
        #steeve-dialog .btc-price-box .price-dim { color: #aaa; font-size: 11px; margin-top: 4px; }
        #steeve-dialog .btc-refresh-btn {
            flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
            background: rgba(245,181,59,0.15); border: 1px solid rgba(245,181,59,0.6);
            color: #f5b53b; font-size: 18px; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center; transition: all 0.15s;
        }
        #steeve-dialog .btc-refresh-btn:hover { background: rgba(245,181,59,0.35); color: #fff; }
        #steeve-dialog .btc-refresh-btn:disabled { opacity: 0.6; cursor: wait; }
        #steeve-dialog .btc-refresh-btn.spinning { animation: btcSpin 0.8s linear infinite; }
        @keyframes btcSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>

    <div id="steeve-dialog">
        <h2>Алексей Дементьев</h2>
        <p id="steeve-dialog-text"><b>Супер Пупер Биток Трейдер</b><br><br>
        — Привет! Я Алексей. В трейдинге я человек опытный и мечтаю научить каждого.<br><br>
        — Расскажу многое полезное о реализации криптовалют, в особенности биткоина. Спрашивай когда захочешь!</p>
        <div id="steeve-wallet-section" style="display:none;">
            <div class="steeve-wallet-box">
                <div class="label">👛 Мой кошелёк BTC</div>
                <div class="dim" id="steeve-wallet-id"></div>
                <div class="mono" id="steeve-wallet-address"></div>
            </div>
            <div style="margin-bottom: 8px;">
                <button class="steeve-price-btn" id="steeve-new-address-btn" onclick="newSteeveAddress()">📮 Создать новый адрес</button>
            </div>
            <div style="margin-bottom: 8px;">
                <button class="steeve-price-btn" style="width:100%;" onclick="showSteeveBalance()">💰 Баланс кошелька</button>
            </div>
        </div>
        <div style="margin-bottom: 12px;">
            <button class="steeve-price-btn" id="steeve-btc-price-btn" onclick="refreshSteeveBtcPrice()">💰 Узнать курс биткоина</button>
        </div>
        <div id="steeve-btc-price-section" style="display:none;">
            <div class="btc-price-box">
                <div class="label">📈 Курс биткоина</div>
                <div class="price-row">
                    <div class="price-val" id="steeve-btc-price-val"></div>
                    <button class="btc-refresh-btn" id="steeve-btc-refresh-btn" onclick="refreshSteeveBtcPrice()" aria-label="Обновить курс">🔄</button>
                </div>
                <div class="price-dim" id="steeve-btc-price-time"></div>
            </div>
        </div>
        <div style="margin-bottom: 12px;">
            <button class="steeve-price-btn" id="steeve-create-wallet-btn" onclick="createSteeveWallet()">🔑 Завести кошелёк</button>
        </div>
        <button class="steeve-close" onclick="closeSteeveDialog()">Закрыть</button>
    </div>

    <div id="steeve-info-dialog">
        <button class="steeve-info-dialog-x" onclick="closeSteeveInfoDialog()" aria-label="Закрыть">✖</button>
        <h2>Кошелёк — Алексей Дементьев</h2>
        <div class="steeve-info-content" id="steeve-info-content"></div>
        <button class="steeve-close" onclick="closeSteeveInfoDialog()">Закрыть</button>
    </div>
</th:block>

<th:block th:fragment="logic">
    <script th:inline="none">
        (function () {
            // ============================================================
            // ROOM 2 (left) — Steve "Алексей Дементьев" (BTC trader)
            // ============================================================

            var steeveObject = null;
            var steeveLabel = null;
            var steeveMumbleSpriteRef = null;
            var steeveMumbleMat = null;
            var steeveMumbleOpacity = 0;
            var steeveMumbleTargetOpacity = 0;
            var steeveMumbleTimer = null;
            var steeveBaseY = 0;

            // Waypoints inside second room (centered at x=-6.01, z=-0.01, z spans 0..-5.26)
            var steeveWaypoints = [];
            steeveWaypoints.push({ x: -6.01, z: -4.01 });
            steeveWaypoints.push({ x: -5.21, z: -2.51 });
            steeveWaypoints.push({ x: -6.61, z: -1.51 });
            steeveWaypoints.push({ x: -5.51, z: -3.51 });
            steeveWaypoints.push({ x: -6.91, z: -4.21 });
            steeveWaypoints.push({ x: -6.01, z: -2.01 });
            steeveWaypoints.push({ x: -5.11, z: -1.01 });
            steeveWaypoints.push({ x: -6.41, z: -3.01 });

            var steeveCurrentWaypoint = 0;
            var steeveWalkSpeed = 0.04;
            var steeveWalkPhase = 0;
            var steeveWalking = false;
            var steeveIdleTimer = null;
            var steeveTargetX = -6.01, steeveTargetZ = -4.01;
            var steeveCurrentRotation = 0;

            function startSteeveWalk() {
                steeveCurrentWaypoint = (steeveCurrentWaypoint + 1) % steeveWaypoints.length;
                var wp = steeveWaypoints[steeveCurrentWaypoint];
                steeveTargetX = wp.x;
                steeveTargetZ = wp.z;
                steeveWalking = true;
            }

            function scheduleNextSteeveWalk() {
                var delay = 4000 + Math.random() * 8000; // 4-12 sec idle
                steeveIdleTimer = setTimeout(startSteeveWalk, delay);
            }

            function showSteeveDialog() {
                var dlg = document.getElementById('steeve-dialog');
                dlg.classList.remove('fade-out');
                dlg.style.display = 'block';
                refreshSteeveWallet();
                loadSteeveBtcPrice();
            }

            window.closeSteeveDialog = function () {
                var dlg = document.getElementById('steeve-dialog');
                dlg.classList.add('fade-out');
                setTimeout(function () { dlg.style.display = 'none'; dlg.classList.remove('fade-out'); }, 500);
            };

            // ---- Wallet for purchases at Alexey's shop ----
            // Each visitor has a unique id stored in localStorage; the wallet file is
            // kept on the server in the btc.storage-dir catalog as {userId}.wallet
            function steeveUserId() {
                var id = localStorage.getItem('alexey-btc-user-id');
                if (!id) {
                    id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                    localStorage.setItem('alexey-btc-user-id', id);
                }
                return id;
            }

            function steeveWalletRequest(path, opts) {
                return fetch('/api/btc/wallet/' + encodeURIComponent(steeveUserId()) + path, opts);
            }

            window.copySteeveAddress = function (el) {
                var container = el.closest('.mono') || el;
                var text = container.getAttribute('data-address') || '';
                if (!text) return;
                function flashHint() {
                    var hint = container.querySelector('.copy-hint');
                    if (hint) {
                        hint.textContent = '✓ Скопировано!';
                        hint.classList.add('show');
                        setTimeout(function () { hint.classList.remove('show'); }, 1500);
                    }
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(flashHint).catch(function () {
                        fallbackCopy(text); flashHint();
                    });
                } else {
                    fallbackCopy(text); flashHint();
                }
            };

            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
            }

            function setSteeveAddress(addrEl, address) {
                if (!address) {
                    addrEl.setAttribute('data-address', '');
                    addrEl.innerHTML = 'Адрес: <span style="color:#aaa">нет адреса — нажмите «Создать новый адрес»</span>';
                    return;
                }
                addrEl.setAttribute('data-address', address);
                addrEl.innerHTML = 'Адрес: <span class="addr-link">' + address +
                    '</span><span class="copy-hint">📋 нажми, чтобы скопировать</span>';
                var link = addrEl.querySelector('.addr-link');
                link.onclick = function () { window.copySteeveAddress(link); };
            }

            function showSteeveWalletBox(info) {
                var section = document.getElementById('steeve-wallet-section');
                var createBtn = document.getElementById('steeve-create-wallet-btn');
                if (!section) return;
                document.getElementById('steeve-wallet-id').textContent = 'ID: ' + info.id;
                setSteeveAddress(document.getElementById('steeve-wallet-address'), info.address);
                section.style.display = 'block';
                if (createBtn) createBtn.style.display = 'none';
            }

            function refreshSteeveWallet() {
                var section = document.getElementById('steeve-wallet-section');
                if (!section) return;
                if (!localStorage.getItem('alexey-btc-user-id')) return;
                steeveWalletRequest('')
                    .then(function (r) {
                        if (r.ok) return r.json();
                        throw new Error('HTTP ' + r.status);
                    })
                    .then(showSteeveWalletBox)
                    .catch(function () { /* wallet not created yet — ignore */ });
            }

            window.createSteeveWallet = function () {
                var btn = document.getElementById('steeve-create-wallet-btn');
                var textEl = document.getElementById('steeve-dialog-text');
                if (!btn || !textEl) return;
                btn.disabled = true;
                btn.textContent = '⏳ Завожу кошелёк...';
                textEl.innerHTML = '<b>Супер Пупер Биток Трейдер</b><br><br>' +
                    '— Секунду, заведу тебе кошелёк...<br><br>' +
                    '— Это необходимо, чтобы оплачивать покупки в моей лавке.';

                steeveWalletRequest('', { method: 'POST' })
                    .then(function (r) {
                        if (r.ok) return r.json();
                        return r.json().then(function (e) { throw new Error(e.error || 'HTTP ' + r.status); });
                    })
                    .then(function (info) {
                        textEl.innerHTML = '<b>Супер Пупер Биток Трейдер</b><br><br>' +
                            '— Готово! Кошелёк заведён под твоим идентификатором. Он нужен для покупок в моей лавке.<br><br>' +
                            '— Внизу можно посмотреть баланс, транзакции и создать новый receive-адрес.';
                        showSteeveWalletBox(info);
                    })
                    .catch(function (err) {
                        textEl.innerHTML = '<b>Супер Пупер Биток Трейдер</b><br><br>' +
                            '— Ой, не вышло завести кошелёк: ' + err.message + '. Попробуй ещё раз.';
                    })
                    .finally(function () {
                        btn.disabled = false;
                        btn.textContent = '🔑 Завести кошелёк';
                    });
            };

            window.newSteeveAddress = function () {
                var btn = document.getElementById('steeve-new-address-btn');
                var addrEl = document.getElementById('steeve-wallet-address');
                if (!btn || !addrEl) return;
                btn.disabled = true;
                btn.textContent = '⏳ Генерирую адрес...';
                steeveWalletRequest('/address', { method: 'POST' })
                    .then(function (r) {
                        if (r.ok) return r.json();
                        return r.json().then(function (e) { throw new Error(e.error || 'HTTP ' + r.status); });
                    })
                    .then(function (data) {
                        setSteeveAddress(addrEl, data.address);
                    })
                    .catch(function (err) {
                        addrEl.textContent = 'Ошибка: ' + err.message;
                    })
                    .finally(function () {
                        btn.disabled = false;
                        btn.textContent = '📮 Создать новый адрес';
                    });
            };

            function openSteeveInfo(content) {
                var dlg = document.getElementById('steeve-info-dialog');
                if (!dlg) return;
                document.getElementById('steeve-info-content').innerHTML = content;
                dlg.classList.remove('fade-out');
                dlg.style.display = 'block';
            }

            window.closeSteeveInfoDialog = function () {
                var dlg = document.getElementById('steeve-info-dialog');
                if (!dlg) return;
                dlg.classList.add('fade-out');
                setTimeout(function () { dlg.style.display = 'none'; dlg.classList.remove('fade-out'); }, 500);
            };

            window.showSteeveBalance = function () {
                openSteeveInfo('<i>Загружаю баланс...</i>');
                loadSteeveBalance();
            };

            function loadSteeveBalance() {
                var sat = 0;
                var rubRate = 0;
                steeveWalletRequest('/confirmed-balance')
                    .then(function (r) {
                        if (r.ok) return r.json();
                        return r.json().then(function (e) { throw new Error(e.error || 'HTTP ' + r.status); });
                    })
                    .then(function (data) {
                        sat = Number(data.balanceSat);
                        return fetch('/api/btc-price/cached');
                    })
                    .then(function (r) {
                        if (r.status === 404) {
                            return fetch('/api/btc-price').then(function (rr) {
                                if (rr.ok) return rr.json();
                                throw new Error('Курс BTC недоступен');
                            });
                        }
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (price) {
                        rubRate = parseFloat(price.priceRub);
                        var rubVal = isFinite(rubRate) ? sat / 100000000 * rubRate : 0;
                        var html =
                            '<div style="color:#f5b53b; font-size:14px; margin-bottom:8px;">💰 Баланс кошелька</div>' +
                            '<div style="font-size:26px; color:#fff; text-align:center;">' +
                            sat.toLocaleString('ru-RU') + ' сатоши</div>' +
                            '<div style="color:#8ef; text-align:center; margin-top:4px;">≈ ' +
                            (sat / 100000000).toFixed(8) + ' BTC</div>' +
                            '<div style="color:#f5b53b; text-align:center; margin-top:4px;">≈ ' +
                            rubVal.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) +
                            ' ₽</div>';
                        return steeveWalletRequest('/pending-tx').then(function (r) {
                            if (r.ok) return r.json();
                            return [];
                        }).then(function (txs) {
                            if (txs && txs.length > 0) {
                                html += '<div style="color:#f5b53b; font-size:13px; margin-top:14px; margin-bottom:6px;">' +
                                    '⏳ Ожидают подтверждения (&lt; 3) ' +
                                    '<button onclick="refreshSteevePending()" style="background:rgba(245,181,59,0.15);border:1px solid rgba(245,181,59,0.6);color:#f5b53b;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;margin-left:6px;">🔄 Обновить</button>' +
                                    '</div>';
                                txs.forEach(function (tx) {
                                    var txRub = isFinite(rubRate) ? Number(tx.valueSat) / 100000000 * rubRate : 0;
                                    html += '<div style="border-top:1px solid rgba(245,181,59,0.2); padding:6px 0;">' +
                                        '<div style="word-break:break-all; font-size:11px; color:#8ef;">' + tx.txId + '</div>' +
                                        '<div style="margin-top:2px;">+' + Number(tx.valueSat).toLocaleString('ru-RU') +
                                        ' сат ≈ ' + (Number(tx.valueSat) / 100000000).toFixed(8) + ' BTC ≈ ' +
                                        txRub.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) +
                                        ' ₽ · подтверждений: ' + tx.depth + '/3</div></div>';
                                });
                            } else {
                                html += '<div style="color:#aaa; text-align:center; margin-top:12px;">Неподтверждённых транзакций нет.</div>';
                            }
                            openSteeveInfo(html);
                        });
                    })
                    .catch(function (err) {
                        openSteeveInfo('Ошибка: ' + err.message);
                    });
            }

            window.refreshSteevePending = function () {
                var content = document.getElementById('steeve-info-content');
                if (content) content.innerHTML = '<i>Обновляю...</i>';
                loadSteeveBalance();
            };

            // ---- BTC price display with caching ----
            function formatBtcPrice(data) {
                var usd = parseFloat(data.priceUsd);
                var rub = parseFloat(data.priceRub);
                var usdText = isFinite(usd)
                    ? '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    : data.priceUsd;
                var rubText = isFinite(rub)
                    ? '₽' + rub.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    : data.priceRub;
                return usdText + ' / ' + rubText;
            }

            function formatBtcSavedAt(savedAt) {
                try {
                    var d = new Date(savedAt);
                    if (isNaN(d.getTime())) return savedAt;
                    return d.toLocaleString('ru-RU', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                } catch (e) {
                    return savedAt;
                }
            }

            function showSteeveBtcPrice(data) {
                var section = document.getElementById('steeve-btc-price-section');
                if (!section) return;
                document.getElementById('steeve-btc-price-val').textContent = formatBtcPrice(data);
                document.getElementById('steeve-btc-price-time').textContent =
                    'сохранено: ' + formatBtcSavedAt(data.savedAt);
                section.style.display = 'block';
            }

            function loadSteeveBtcPrice() {
                fetch('/api/btc-price/cached')
                    .then(function (r) {
                        if (r.status === 404) return null;
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (data) {
                        if (data) showSteeveBtcPrice(data);
                    })
                    .catch(function () { /* ignore */ });
            }

            window.refreshSteeveBtcPrice = function () {
                var section = document.getElementById('steeve-btc-price-section');
                if (section) section.style.display = 'block';
                var valEl = document.getElementById('steeve-btc-price-val');
                if (valEl) valEl.textContent = '⏳ Запрашиваю курс...';
                var timeEl = document.getElementById('steeve-btc-price-time');
                if (timeEl) timeEl.textContent = '';
                var btn = document.getElementById('steeve-btc-refresh-btn');
                if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
                fetch('/api/btc-price')
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (data) {
                        showSteeveBtcPrice(data);
                    })
                    .catch(function (err) {
                        if (section) {
                            section.style.display = 'block';
                            if (valEl) valEl.textContent = 'Ошибка: ' + err.message;
                            if (timeEl) timeEl.textContent = '';
                        }
                    })
                    .finally(function () {
                        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
                    });
            };

            window.Room3DComponents.push({
                id: 'alexey',
                load: function (ctx) {
                    // ---- Load Steve (Alexey Dementiev) inside the left room ----
                    var steeveMtlLoader = new THREE.MTLLoader();
                    steeveMtlLoader.setPath('/steeve/');
                    steeveMtlLoader.load('minecraft_-_steve.mtl', function (steeveMats) {
                        steeveMats.preload();

                        var steeveObjLoader = new THREE.OBJLoader();
                        steeveObjLoader.setMaterials(steeveMats);
                        steeveObjLoader.setPath('/steeve/');
                        steeveObjLoader.load('minecraft_-_steve.obj', function (steve) {
                            // Steve bounds are ~16x32x8 units, scale to ~1.2m tall
                            var box = new THREE.Box3().setFromObject(steve);
                            var size = box.getSize(new THREE.Vector3());
                            var maxDim = Math.max(size.x, size.y, size.z);
                            var scale = 1.2 / maxDim;
                            steve.scale.setScalar(scale);

                            // Reposition: center horizontally, place on floor
                            var scaledBox = new THREE.Box3().setFromObject(steve);
                            var center = scaledBox.getCenter(new THREE.Vector3());
                            steve.position.x -= center.x;
                            steve.position.z -= center.z;
                            steve.position.y -= scaledBox.min.y;

                            // Place inside second room (room2 centered at x=-6.01, z=-0.01)
                            steve.position.x += -6.01;
                            steve.position.z += -3.01;

                            // Store base Y for breathing animation
                            steeveBaseY = steve.position.y;
                            steve.rotation.y = 0;

                            // Register meshes for click interaction
                            steve.traverse(function (child) {
                                if (child.isMesh) {
                                    child.userData.isSteeve = true;
                                    if (child.material && child.material.name) {
                                        child.userData.materialName = child.material.name;
                                    }
                                    ctx.interactives.push(child);
                                }
                            });

                            ctx.scene.add(steve);
                            steeveObject = steve;

                            // ---- Text label above Steve ----
                            var stLabelCanvas = document.createElement('canvas');
                            stLabelCanvas.width = 1024;
                            stLabelCanvas.height = 256;
                            var stlctx = stLabelCanvas.getContext('2d');
                            stlctx.font = 'bold 44px Arial';
                            stlctx.fillStyle = '#f5b53b';
                            stlctx.textAlign = 'center';
                            stlctx.textBaseline = 'middle';
                            stlctx.fillText('Алексей Дементьев', 512, 80);
                            stlctx.font = '30px Arial';
                            stlctx.fillStyle = '#f5b53b';
                            stlctx.fillText('Супер Пупер Биток Трейдер', 512, 180);
                            var stLabelTex = new THREE.CanvasTexture(stLabelCanvas);
                            var stLabelMat = new THREE.SpriteMaterial({ map: stLabelTex, transparent: true });
                            var stLabelSprite = new THREE.Sprite(stLabelMat);
                            stLabelSprite.position.set(-6.01, 1.6, -3.01);
                            stLabelSprite.scale.set(2.6, 0.65, 1);
                            ctx.scene.add(stLabelSprite);
                            steeveLabel = stLabelSprite;

                            // ---- Mumbling text above Steve (crypto trader) ----
                            var steeveMumbles = [
                                'биток завтра упадёт...',
                                'покупай на дне...',
                                'продавай на хаях...',
                                'сатоши был прав...',
                                'крипта — это свобода...',
                                'блокчейн решит всё...',
                                'только холд, ничего другого...',
                                'диверсифицируй портфель...',
                                'биток — цифровое золото...',
                                'не вкладывай всё в один токен...',
                                'хедж или скам... хедж...',
                                'медвежий рынок... терпи...',
                                'бычий тренд... держим...',
                                'доллары обесцениваются...',
                                'биток — наше будущее...',
                                'альткоины — это риск...',
                                'ликвидность высокая...',
                                'технология блокчейн...',
                                'ETF одобрили... растём...',
                                'шортить рано...',
                                'лонг — наше всё...',
                                'волатильность — это нормально...',
                                'реализация биткоина проста...',
                                'энтузиасты изменят мир...',
                                'не паникуй, покупай...'
                            ];

                            var stMumbleCanvas = document.createElement('canvas');
                            stMumbleCanvas.width = 512;
                            stMumbleCanvas.height = 128;
                            var smctx = stMumbleCanvas.getContext('2d');
                            var stMumbleTex = new THREE.CanvasTexture(stMumbleCanvas);
                            steeveMumbleMat = new THREE.SpriteMaterial({ map: stMumbleTex, transparent: true, opacity: 0 });
                            var stMumbleSprite = new THREE.Sprite(steeveMumbleMat);
                            stMumbleSprite.position.set(-6.01, 2.1, -3.01);
                            stMumbleSprite.scale.set(2.6, 0.65, 1);
                            ctx.scene.add(stMumbleSprite);
                            steeveMumbleSpriteRef = stMumbleSprite;

                            function showNextSteeveMumble() {
                                var text = steeveMumbles[Math.floor(Math.random() * steeveMumbles.length)];
                                smctx.clearRect(0, 0, 512, 128);
                                smctx.font = 'italic 24px Arial';
                                smctx.fillStyle = '#ffffff';
                                smctx.textAlign = 'center';
                                smctx.textBaseline = 'middle';

                                // Wrap text into multiple lines so it fits the canvas
                                var maxWidth = 480;
                                var words = text.split(' ');
                                var lines = [];
                                var currentLine = '';
                                for (var wi = 0; wi < words.length; wi++) {
                                    var testLine = currentLine.length ? currentLine + ' ' + words[wi] : words[wi];
                                    if (smctx.measureText(testLine).width > maxWidth && currentLine) {
                                        lines.push(currentLine);
                                        currentLine = words[wi];
                                    } else {
                                        currentLine = testLine;
                                    }
                                }
                                if (currentLine) lines.push(currentLine);

                                var lineHeight = 26;
                                var startY = 64 - ((lines.length - 1) * lineHeight) / 2;
                                for (var li = 0; li < lines.length; li++) {
                                    smctx.fillText(lines[li], 256, startY + li * lineHeight);
                                }
                                stMumbleTex.needsUpdate = true;

                                steeveMumbleTargetOpacity = 0.9;

                                setTimeout(function () {
                                    steeveMumbleTargetOpacity = 0;
                                }, 3000);

                                var nextDelay = 5000 + Math.random() * 15000;
                                steeveMumbleTimer = setTimeout(showNextSteeveMumble, nextDelay);
                            }

                            steeveMumbleTimer = setTimeout(showNextSteeveMumble, 4000);

                            ctx.registerHit('isSteeve', showSteeveDialog);

                            scheduleNextSteeveWalk();
                        }, undefined, function (err) {
                            console.error('Steve OBJ load error:', err);
                        });
                    }, undefined, function (err) {
                        console.error('Steve MTL load error:', err);
                    });
                },
                update: function () {
                    // Animate Steve mumble sprite fade
                    if (steeveMumbleMat && steeveMumbleOpacity !== steeveMumbleTargetOpacity) {
                        steeveMumbleOpacity += (steeveMumbleTargetOpacity - steeveMumbleOpacity) * 0.08;
                        if (Math.abs(steeveMumbleOpacity - steeveMumbleTargetOpacity) < 0.01) steeveMumbleOpacity = steeveMumbleTargetOpacity;
                        steeveMumbleMat.opacity = steeveMumbleOpacity;
                    }

                    // Steve (Alexey) walking animation
                    if (steeveObject) {
                        if (steeveWalking) {
                            var sdx = steeveTargetX - steeveObject.position.x;
                            var sdz = steeveTargetZ - steeveObject.position.z;
                            var sdist = Math.sqrt(sdx * sdx + sdz * sdz);

                            if (sdist < 0.05) {
                                // Reached waypoint — stop and idle
                                steeveWalking = false;
                                steeveObject.rotation.z = 0; // straighten up
                                scheduleNextSteeveWalk();
                            } else {
                                // Move toward target
                                var sstepX = (sdx / sdist) * steeveWalkSpeed;
                                var sstepZ = (sdz / sdist) * steeveWalkSpeed;
                                steeveObject.position.x += sstepX;
                                steeveObject.position.z += sstepZ;

                                // Face direction of movement
                                var sTargetAngle = Math.atan2(sdx, sdz);
                                // Smooth rotation
                                var sRotDiff = sTargetAngle - steeveCurrentRotation;
                                while (sRotDiff > Math.PI) sRotDiff -= Math.PI * 2;
                                while (sRotDiff < -Math.PI) sRotDiff += Math.PI * 2;
                                steeveCurrentRotation += sRotDiff * 0.1;
                                steeveObject.rotation.y = steeveCurrentRotation;

                                // Walking bob — sway side to side + slight up/down
                                steeveWalkPhase += 0.15;
                                steeveObject.rotation.z = Math.sin(steeveWalkPhase) * 0.06;
                                steeveObject.position.y = steeveBaseY + Math.abs(Math.sin(steeveWalkPhase)) * 0.03;
                            }
                        } else {
                            // Idle — breathing
                            steeveWalkPhase += 0.02;
                            steeveObject.position.y = steeveBaseY + Math.sin(steeveWalkPhase) * 0.012;
                        }

                        // Sync label and mumble sprite position with Steve
                        if (steeveLabel) {
                            steeveLabel.position.x = steeveObject.position.x;
                            steeveLabel.position.z = steeveObject.position.z;
                        }
                        if (steeveMumbleSpriteRef) {
                            steeveMumbleSpriteRef.position.x = steeveObject.position.x;
                            steeveMumbleSpriteRef.position.z = steeveObject.position.z;
                        }
                    }
                }
            });
        })();
    </script>
</th:block>
</body>
