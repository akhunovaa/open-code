spring.application.name=spring-mvc-app
server.port=${PORT:8080}

# Каталог хранения BTC-кошельков и кэша курса.
# Локально: BTC_STORAGE_DIR=/Users/azatakhunov/temp/btc
# На Amvera: /data (значение по умолчанию)
btc.storage-dir=${BTC_STORAGE_DIR:/data}

# Сеть Bitcoin для кошельков: mainnet (по умолчанию), regtest, testnet, signet.
# Локально для тестирования: BTC_NETWORK=regtest
btc.network=${BTC_NETWORK:mainnet}
