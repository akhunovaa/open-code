    <ellipse cx="250" cy="170" rx="250" ry="55" fill="url(#milkyBand)" opacity="0.7"/>
    <ellipse cx="220" cy="165" rx="120" ry="35" fill="url(#galaxyArm1)" opacity="0.5"/>
    <ellipse cx="290" cy="175" rx="120" ry="35" fill="url(#galaxyArm2)" opacity="0.5"/>
    <ellipse cx="250" cy="170" rx="70" ry="25" fill="url(#galaxyCore)"/>
    <ellipse cx="250" cy="168" rx="35" ry="12" fill="#fff8e7" opacity="0.25"/>
    <ellipse cx="250" cy="167" rx="15" ry="5" fill="#fffde7" opacity="0.4"/>
  </g>

  <rect x="60" y="20" width="380" height="32" rx="16" fill="#0f3460" stroke="#f5b53b" stroke-width="1"/>
  <text x="250" y="42" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#74b9ff" letter-spacing="1.5">Как ракеты в космос — Ваш Agile взлетит!</text>

  <g opacity="0.6">
    <circle cx="50" cy="80" r="1" fill="#fff"/>
    <circle cx="120" cy="40" r="0.8" fill="#fff"/>
    <circle cx="200" cy="70" r="1.2" fill="#fff"/>
    <circle cx="350" cy="50" r="0.9" fill="#fff"/>
    <circle cx="430" cy="90" r="1" fill="#fff"/>
    <circle cx="80" cy="150" r="0.7" fill="#fff"/>
    <circle cx="450" cy="180" r="1.1" fill="#fff"/>
    <circle cx="30" cy="250" r="0.8" fill="#fff"/>
    <circle cx="470" cy="300" r="1" fill="#fff"/>
    <circle cx="100" cy="350" r="0.6" fill="#fff"/>
    <circle cx="380" cy="370" r="0.9" fill="#fff"/>
    <circle cx="250" cy="30" r="0.5" fill="#fff"/>
    <circle cx="180" cy="120" r="0.7" fill="#fff"/>
    <circle cx="320" cy="100" r="0.6" fill="#fff"/>
  </g>

  <g transform="translate(250, 150)">
    <path d="M 0,-70 L 12,-30 L 12,30 L -12,30 L -12,-30 Z" fill="url(#rocketBody)" stroke="#f5b53b" stroke-width="1"/>
    <path d="M -12,10 L -25,35 L -12,30 Z" fill="#c62828"/>
    <path d="M 12,10 L 25,35 L 12,30 Z" fill="#c62828"/>
    <circle cx="0" cy="-20" r="5" fill="#1a1a2e" stroke="#f5b53b" stroke-width="1.5"/>
    <path d="M -8,30 L 0,55 L 8,30 Z" fill="url(#flame)"/>
    <path d="M -5,30 L 0,42 L 5,30 Z" fill="#ffeb3b"/>
    <rect x="-10" y="-45" width="20" height="3" fill="#f5b53b" rx="1"/>
    <text x="0" y="-55" text-anchor="middle" font-family="Arial" font-size="7" fill="#f5b53b" font-weight="bold">π</text>
  </g>

  <text x="250" y="245" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="url(#goldText)">Термодинамика Agile</text>
  <text x="250" y="265" text-anchor="middle" font-family="Arial" font-size="13" fill="#74b9ff">Биофизическая модель</text>
  <text x="250" y="282" text-anchor="middle" font-family="Arial" font-size="13" fill="#74b9ff">спринт-планирования</text>
  <text x="250" y="299" text-anchor="middle" font-family="Arial" font-size="10" fill="#7ee07e">Математически доказанная модель</text>

  <line x1="120" y1="312" x2="380" y2="312" stroke="#f5b53b" stroke-width="0.5" opacity="0.5"/>

  <text x="250" y="329" text-anchor="middle" font-family="Courier New" font-size="14" fill="#f5b53b" font-weight="bold">ln(R) × I ≈ π</text>

  <rect x="80" y="345" width="340" height="45" rx="8" fill="url(#titleBg)" stroke="#f5b53b" stroke-width="1"/>
  <text x="250" y="361" text-anchor="middle" font-family="Arial" font-size="9" fill="#e94560" font-weight="bold">ФОРМУЛА ВЕЛИКОГО УЧЁНОГО</text>
  <text x="250" y="374" text-anchor="middle" font-family="Arial" font-size="8" fill="#f5b53b" font-weight="bold">Циолковского Константина Эдуардовича</text>

  <text x="250" y="395" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">© Ахунов А.А. · 2026</text>
