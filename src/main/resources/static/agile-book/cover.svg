      <stop offset="50%" stop-color="#3949ab" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="milkyBand" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#1a237e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3949ab" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#7986cb" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#c5cae9" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#7986cb" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#3949ab" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a237e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b53b"/>
      <stop offset="40%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
