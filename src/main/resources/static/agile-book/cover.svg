<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <radialGradient id="spaceBg" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="50%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="galaxyCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#ffe0b2" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#b39ddb" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#5c6bc0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a237e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galaxyArm1" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#e8eaf6" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#9fa8da" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a237e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galaxyArm2" cx="0.7" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#e8eaf6" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#9fa8da" stop-opacity="0.08"/>
